<div id="partForm" class="page">
  <div class="container">
    <button class="back-btn" onclick="showPage('partOptions')">
      <i class="fas fa-arrow-right"></i> رجوع
    </button>
    
    <div class="header" style="margin-bottom: 24px; text-align: center;">
      <h1 class="logo" style="font-size: 2.5rem; margin-bottom: 8px;">مكتبة الآيات</h1>
      <p style="color: var(--text-secondary);">اختر القارئ والآيات المحددة لإنشاء مقطعك</p>
    </div>
    
    <div class="form-container" style="max-width: 600px; margin: 0 auto;">
      
      <div class="form-section primary-section">
        <h3 style="margin-bottom: 20px; color: var(--primary-color);">إعدادات التلاوة</h3>
        <div class="form-group"><label>الرواية</label><select id="partMushaf" class="form-control"></select></div>
        <div class="form-group"><label for="edition">القارئ</label><select id="edition" class="form-control"></select></div>
        <div class="form-group"><label for="surahNumber">السورة</label><select id="surahNumber" class="form-control"></select></div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label for="startVerse">آية البداية</label>
            <input type="number" min="1" id="startVerse" class="form-control" placeholder="رقم الآية">
          </div>
          <div class="form-group">
            <label for="endVerse">آية النهاية</label>
            <input type="number" min="1" id="endVerse" class="form-control" placeholder="رقم الآية">
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="verticalVideoPart">
          <label for="verticalVideoPart">فيديو طولي للريلز (9:16) 
            <i class="fas fa-info-circle tooltip-icon" style="color:var(--text-secondary); cursor:pointer; margin-right:5px;" onclick="window.showTooltip(this, 'verticalVideo')"></i>
          </label>
        </div>
      </div>

      <details class="advanced-settings-accordion" style="margin-top: 24px; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; background: var(--bg-secondary);">
        <summary style="cursor: pointer; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; justify-content: space-between;">
          <span><i class="fas fa-sliders-h" style="margin-left: 8px; color: var(--primary-color);"></i> إعدادات متقدمة (اختياري)</span>
        </summary>
        
        <div style="margin-top: 20px; display: grid; gap: 16px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group"><label for="fontColorPart">لون النص</label><input type="color" id="fontColorPart" value="#ffffff" style="width: 100%; height: 40px; padding: 0; border: none;"></div>
            <div class="form-group"><label for="fontSizePart">حجم الخط</label><input type="range" id="fontSizePart" min="1" max="72" value="10"><span id="fontSizeValuePart" style="font-size: 14px; margin-right: 8px;">10px</span></div>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group"><label for="fontNamePart">الخط</label><select id="fontNamePart" class="form-control"><option value="Tasees Regular">Tasees</option><option value="DecoType Thuluth II">DTHULUTH II</option></select></div>
            <div class="form-group"><label for="subtitlePositionPart">موقع النص</label><select id="subtitlePositionPart" class="form-control"><option value="bottom">أسفل</option><option value="middle">وسط</option></select></div>
          </div>
          
          <div class="checkbox-group"><input type="checkbox" id="showMetadataPart"><label for="showMetadataPart">عرض معلومات السورة والقارئ</label></div>
          <div class="form-group"><label for="resolutionPart">دقة الفيديو</label><select id="resolutionPart" class="form-control"><option value="720p">720p (سريع - HD)</option><option value="480p">480p (فائق السرعة - SD)</option><option value="1080p">1080p (بطيء - FHD)</option></select></div>
          <div class="form-group"><label for="translationEditionPart">الترجمة</label><select id="translationEditionPart" class="form-control"><option value="">بدون</option><option value="en.sahih">English - Sahih</option><option value="es.cortes">Español - Cortes</option></select></div>
          
          <h4 style="margin-top: 16px; margin-bottom: 8px; color: var(--text-secondary); font-size: 0.95rem;">الخلفية</h4>
          <div class="form-group"><label for="pexelsVideoPart">البحث بكلمات مفتاحية</label><input type="text" id="pexelsVideoPart" placeholder="أدخل كلمة مفتاحية" class="form-control"></div>
          <div class="form-group"><label for="imageLinkPart">رابط صورة</label><input type="text" id="imageLinkPart" placeholder="أدخل رابط الصورة" class="form-control"></div>
          <div class="form-group"><label for="youtubeLinkPart">رابط YouTube</label><input type="text" id="youtubeLinkPart" placeholder="أدخل رابط YouTube" class="form-control"></div>
          <div class="form-group"><label for="backgroundUploadPart">رفع خلفية من الجهاز</label><input type="file" id="backgroundUploadPart" class="form-control" accept="video/*,image/*"></div>
        </div>
      </details>

      <button class="action-btn create-btn" style="margin-top: 32px;"><i class="fas fa-magic" style="margin-left: 8px;"></i> إنشاء الفيديو</button>
    </div>
  </div>
</div>
